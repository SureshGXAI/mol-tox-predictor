name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline test dependencies
        # Deliberately light: the smoke tests run without torch/mlflow/network.
        run: |
          python -m pip install --upgrade pip
          pip install rdkit numpy pandas scikit-learn requests pytest
      - name: Run smoke tests
        env:
          MLFLOW_DISABLE: "1"
        run: pytest tests/ -q
